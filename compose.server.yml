# Apply after compose.container.yml. Keep ports private until public HTTPS setup.
name: rag-server
services:
  db:
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=30', '-c', 'work_mem=4MB']
  setup:
    environment:
      DJANGO_DEBUG: 'false'
  web:
    environment:
      DJANGO_DEBUG: 'false'
      WEB_WORKERS: '1'
  cleanup:
    environment:
      DJANGO_DEBUG: 'false'
  nginx:
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./deploy/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/rag-portfolio/tls:/etc/nginx/tls:ro
