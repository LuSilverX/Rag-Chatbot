# Standalone local stack; intentionally separate from the development DB Compose file.
name: rag-container

x-app: &app
  image: rag-chatbot:${APP_IMAGE_TAG:-local}
  pull_policy: never
  env_file: .env.container
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: '5432'
    DJANGO_TRUST_PROXY: 'true'
    DJANGO_TRUST_CLIENT_IP: 'true'
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 130s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use deploy/compose.sh with a configured .env.container}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  setup:
    <<: *app
    restart: 'no'
    command: ['sh', '-c', 'python manage.py migrate --noinput && python manage.py collectstatic --noinput']
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - static:/app/staticfiles

  web:
    <<: *app
    build: .
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s

  cleanup:
    <<: *app
    command: ['python', 'manage.py', 'cleanup_workspaces', '--watch', '--heartbeat-file', '/tmp/cleanup-heartbeat']
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', "import os,time; assert time.time()-os.stat('/tmp/cleanup-heartbeat').st_mtime < 120"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:${RAG_HTTP_PORT:-8088}:8080'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health/']
      interval: 15s
      timeout: 8s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  database:
  static:
